<use xlink:href="#fmn" transform="translate(30,96) scale(0.85)"/>
</g>
<circle cx="64" cy="54" r="1.4" fill="#e7a3be" stroke="none"/>
<circle cx="8" cy="72" r="1.4" fill="#9cc4ee" stroke="none"/>
