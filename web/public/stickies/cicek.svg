<use xlink:href="#petal"/><use xlink:href="#petal" transform="rotate(60)"/><use xlink:href="#petal" transform="rotate(120)"/>
<use xlink:href="#petal" transform="rotate(180)"/><use xlink:href="#petal" transform="rotate(240)"/><use xlink:href="#petal" transform="rotate(300)"/>
<circle r="4.8" fill="#f7d354" stroke="#c99a1f"/>
</g>
<!-- lale -->
<path d="M91,85 C90,94 92,102 91,112" fill="none" stroke="#6f9a55"/>
<path d="M91,102 C84,100 80,94 79,89 C86,91 90,96 91,102Z" fill="#a8d08d" stroke="#6f9a55"/>
<path d="M84,80 C82,72 84,67 86,65 L89,70 L92,64 L95,70 L98,65 C100,67 101,73 98,80 C96,86 86,86 84,80Z" fill="#f08c7e" stroke="#c0574a"/>
